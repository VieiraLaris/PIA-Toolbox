site_name: PIA Toolbox
repo_name: PIA Toolbox
repo_url: https://github.com/VieiraLaris/PIA-Toolbox

nav:
  - Início: index.md
  - Projeto: projeto/projeto.md

theme:
  name: material
  favicon: https://upload.wikimedia.org/wikipedia/commons/2/21/Matlab_Logo.png?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original
  logo: https://upload.wikimedia.org/wikipedia/commons/2/21/Matlab_Logo.png?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original

  icon:
    repo: fontawesome/brands/github

  font:
    text: Poppins

  language: pt

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.integrate
    - search.suggest
    - search.highlight

  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
      primary: deep orange
      accent: blue

    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
      primary: black
      accent: light blue

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.inlinehilite
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.snippets